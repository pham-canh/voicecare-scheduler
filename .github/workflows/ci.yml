name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # requirements-dev.txt is pytest only. The suite in src/test_smoke.py
      # deliberately exercises pure functions and never imports streamlit, so
      # the test gate stays under a second and stays runnable offline.
      - run: pip install -r requirements-dev.txt
      # App dependencies are a separate step so that a broken streamlit pin
      # fails as a dependency error rather than as a confusing collection
      # error inside the test step.
      - name: app dependency install
        run: pip install -r requirements.txt
      - name: smoke test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest src/ -q